<!-- Sign In Section -->


<section class="container mt-5 mb-5">


<div class="row justify-content-center">



<div class="col-md-6">



<div class="card shadow">



<div class="card-body">



<h1 class="text-center mb-4">

Register / Sign In

</h1>





<form id="signinForm">





<div class="form-group">


<label for="name">

Full Name

</label>


<input 
type="text"
class="form-control"
id="name"
placeholder="Enter your name"
required>


</div>







<div class="form-group">


<label for="email">

Email Address

</label>


<input 
type="email"
class="form-control"
id="email"
placeholder="Enter your email"
required>


</div>







<div class="form-group">


<label for="phone">

Phone Number

</label>


<input 
type="tel"
class="form-control"
id="phone"
placeholder="Enter your phone number">


</div>







<div class="form-group">


<label for="program">

Select Program

</label>



<select 
class="form-control"
id="program">


<option>
Swimming Lessons
</option>


<option>
Adult Program
</option>


<option>
Competitive Swimming
</option>


<option>
Parent & Me
</option>


</select>


</div>







<div class="form-group">


<label for="message">

Message

</label>


<textarea
class="form-control"
id="message"
rows="4"
placeholder="Tell us how we can help">
</textarea>


</div>








<button 
type="submit"
class="btn btn-primary btn-block">


Submit Registration


</button>





</form>





</div>


</div>


</div>



</div>
